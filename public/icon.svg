  <!-- Sparkle Accent in top right -->
  <circle cx="360" cy="150" r="28" fill="#6cf8bb" filter="url(#dropShadow)"/>
  <path d="M360 134 L364 146 L376 150 L364 154 L360 166 L356 154 L344 150 L356 146 Z" fill="#004ac6"/>
